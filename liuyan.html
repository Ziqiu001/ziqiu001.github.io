<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言墙 | 子秋博客</title>
    <link rel="shortcut icon" href="./images/ZiQiu.jpg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* 基础变量 */
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --secondary-color: #ec4899;
            --accent-color: #f59e0b;
            --owner-color: #fbbf24;
            --owner-glow: rgba(251, 191, 36, 0.4);
            --bg-dark: #0f172a;
            --bg-light: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* 动态背景 */
        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .gradient-sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 20s infinite ease-in-out;
        }

        .sphere-1 {
            width: 600px;
            height: 600px;
            background: linear-gradient(45deg, #6366f1, #a855f7);
            top: -200px;
            right: -100px;
        }

        .sphere-2 {
            width: 400px;
            height: 400px;
            background: linear-gradient(45deg, #ec4899, #f43f5e);
            bottom: -100px;
            left: -100px;
            animation-delay: -5s;
        }

        .sphere-3 {
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #f59e0b, #f97316);
            top: 50%;
            left: 50%;
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* 导航栏 */
        .navbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: var(--glass-shadow);
            transition: var(--transition);
        }

        .navbar.scrolled {
            top: 10px;
            background: rgba(15, 23, 42, 0.9);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.3s;
        }

        .brand-logo:hover {
            transform: rotate(360deg) scale(1.1);
        }

        .brand-text {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 8px;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 500;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .nav-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(236, 72, 153, 0.2));
            opacity: 0;
            transition: opacity 0.3s;
            z-index: -1;
        }

        .nav-link:hover::before,
        .nav-link.active::before {
            opacity: 1;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        /* 汉堡菜单 */
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
        }

        .bar {
            width: 25px;
            height: 3px;
            background: var(--text-primary);
            border-radius: 3px;
            transition: var(--transition);
        }

        /* 主体区域 */
        .guestbook-section {
            min-height: 100vh;
            padding: 120px 5% 60px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 页面头部 */
        .guestbook-header {
            text-align: center;
            margin-bottom: 48px;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .guestbook-badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(236, 72, 153, 0.2);
            border: 1px solid rgba(236, 72, 153, 0.4);
            border-radius: 20px;
            font-size: 0.875rem;
            color: #f9a8d4;
            margin-bottom: 16px;
        }

        .guestbook-title {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #f093fb 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient 3s linear infinite;
        }

        @keyframes gradient {
            to { background-position: 200% center; }
        }

        .guestbook-subtitle {
            color: var(--text-secondary);
            font-size: 1.125rem;
        }

        /* 连接状态指示器 */
        .connection-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
            animation: fadeInUp 0.8s ease-out 0.05s both;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            font-size: 0.875rem;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .status-badge.online {
            background: rgba(34, 197, 94, 0.1);
            border-color: rgba(34, 197, 94, 0.3);
            color: #4ade80;
        }

        .status-badge.offline {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .status-badge.syncing {
            background: rgba(251, 191, 36, 0.1);
            border-color: rgba(251, 191, 36, 0.3);
            color: #fbbf24;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .sync-btn-small {
            padding: 6px 12px;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 20px;
            color: #a5b4fc;
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .sync-btn-small:hover {
            background: rgba(99, 102, 241, 0.3);
        }

        /* 身份切换 */
        .identity-switch {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
            animation: fadeInUp 0.8s ease-out 0.1s both;
        }

        .switch-container {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
        }

        .switch-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            padding: 0 8px;
        }

        .switch-label.active {
            color: var(--owner-color);
            font-weight: 600;
        }

        .switch-btn {
            position: relative;
            width: 56px;
            height: 28px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            outline: none;
        }

        .switch-btn.owner-mode {
            background: linear-gradient(135deg, var(--owner-color), #f59e0b);
            box-shadow: 0 0 20px var(--owner-glow);
        }

        .switch-thumb {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .switch-btn.owner-mode .switch-thumb {
            transform: translateX(28px);
        }

        /* 输入区 */
        .input-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 48px;
            animation: fadeInUp 0.8s ease-out 0.15s both;
            box-shadow: var(--glass-shadow);
            transition: var(--transition);
        }

        .input-section.owner-mode {
            border-color: var(--owner-color);
            box-shadow: 0 0 30px var(--owner-glow), var(--glass-shadow);
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.05), rgba(255, 255, 255, 0.05));
        }

        .input-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .input-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: var(--transition);
        }

        .input-section.owner-mode .input-icon {
            background: linear-gradient(135deg, var(--owner-color), #f59e0b);
            box-shadow: 0 0 20px var(--owner-glow);
        }

        .input-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .owner-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: linear-gradient(135deg, var(--owner-color), #f59e0b);
            border-radius: 20px;
            font-size: 0.75rem;
            color: #0f172a;
            font-weight: 700;
            margin-left: 12px;
            opacity: 0;
            transform: scale(0.8);
            transition: var(--transition);
        }

        .owner-indicator.show {
            opacity: 1;
            transform: scale(1);
        }

        .input-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-input,
        .form-textarea {
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: var(--transition);
            outline: none;
        }

        .form-input:focus,
        .form-textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .input-section.owner-mode .form-input:focus,
        .input-section.owner-mode .form-textarea:focus {
            border-color: var(--owner-color);
            box-shadow: 0 0 0 3px var(--owner-glow);
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .char-count {
            text-align: right;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .submit-btn {
            align-self: flex-start;
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .submit-btn.owner-submit {
            background: linear-gradient(135deg, var(--owner-color), #f59e0b);
            color: #0f172a;
            box-shadow: 0 4px 15px var(--owner-glow);
        }

        /* 统计 */
        .wall-stats {
            display: flex;
            justify-content: center;
            gap: 48px;
            margin-bottom: 32px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .stat-box {
            text-align: center;
            padding: 20px 32px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* 图例 */
        .legend {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .legend-dot.visitor {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        }

        .legend-dot.owner {
            background: linear-gradient(135deg, var(--owner-color), #f59e0b);
            box-shadow: 0 0 10px var(--owner-glow);
        }

        /* 留言墙 */
        .wall-section {
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }

        .wall-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .wall-title {
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .wall-filter {
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: var(--text-secondary);
            font-size: 0.875rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.5);
            color: var(--text-primary);
        }

        /* 瀑布流 */
        .masonry-grid {
            column-count: 3;
            column-gap: 24px;
        }

        .message-card {
            break-inside: avoid;
            margin-bottom: 24px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px;
            transition: var(--transition);
            animation: slideIn 0.5s ease-out;
            position: relative;
            overflow: hidden;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-card:hover {
            transform: translateY(-4px);
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .message-card.new {
            border-color: rgba(236, 72, 153, 0.5);
            animation: pulse-border 2s infinite;
        }

        @keyframes pulse-border {
            0%, 100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(236, 72, 153, 0); }
        }

        /* 博主留言样式 */
        .message-card.owner-message {
            border-color: var(--owner-color);
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.1), rgba(255, 255, 255, 0.05));
            box-shadow: 0 0 20px var(--owner-glow), 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .message-card.owner-message::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, var(--owner-color), #f59e0b);
        }

        .message-card.owner-message:hover {
            box-shadow: 0 0 30px var(--owner-glow), 0 20px 40px rgba(0, 0, 0, 0.4);
            transform: translateY(-6px) scale(1.02);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .message-author {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .author-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            position: relative;
        }

        .author-avatar.owner-avatar {
            background: linear-gradient(135deg, var(--owner-color), #f59e0b);
            box-shadow: 0 0 15px var(--owner-glow);
            border: 2px solid var(--owner-color);
        }

        .author-avatar.owner-avatar::after {
            content: '👑';
            position: absolute;
            bottom: -4px;
            right: -4px;
            font-size: 0.75rem;
            background: var(--owner-color);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg-dark);
        }

        .author-info {
            display: flex;
            flex-direction: column;
        }

        .author-name {
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .author-name.owner-name {
            background: linear-gradient(135deg, var(--owner-color), #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .owner-badge {
            padding: 2px 8px;
            background: linear-gradient(135deg, var(--owner-color), #f59e0b);
            border-radius: 6px;
            font-size: 0.625rem;
            color: #0f172a;
            font-weight: 700;
        }

        .message-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .message-badge {
            padding: 4px 10px;
            background: rgba(99, 102, 241, 0.15);
            border-radius: 12px;
            font-size: 0.75rem;
            color: #a5b4fc;
        }

        .message-content {
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 16px;
            word-wrap: break-word;
        }

        .message-card.owner-message .message-content {
            color: #e2e8f0;
            font-weight: 500;
        }

        .message-footer {
            display: flex;
            gap: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: var(--text-secondary);
            font-size: 0.875rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .action-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.3);
            color: var(--text-primary);
            transform: scale(1.05);
        }

        .action-btn.liked {
            background: rgba(236, 72, 153, 0.2);
            border-color: rgba(236, 72, 153, 0.5);
            color: #f9a8d4;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* 加载动画 */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 响应式 */
        @media (max-width: 968px) {
            .guestbook-title { font-size: 2.5rem; }
            .masonry-grid { column-count: 2; }
            .form-row { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            .hamburger { display: flex; }
            .nav-menu {
                position: fixed;
                left: -100%;
                top: 80px;
                flex-direction: column;
                background: rgba(15, 23, 42, 0.98);
                width: 90%;
                margin: 0 5%;
                text-align: center;
                transition: 0.3s;
                border-radius: 16px;
                padding: 20px;
            }
            .nav-menu.active { left: 0; }
            .nav-link { padding: 16px; display: block; }
            .navbar { width: 95%; top: 10px; }
            .masonry-grid { column-count: 1; }
            .input-section { padding: 24px; }
            .wall-header { flex-direction: column; gap: 16px; align-items: flex-start; }
            .connection-status { flex-direction: column; }
        }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: linear-gradient(var(--primary-color), var(--secondary-color)); border-radius: 5px; }

        /* 提示 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 16px 24px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-primary);
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s;
            z-index: 3000;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success { border-color: rgba(34, 197, 94, 0.5); background: rgba(34, 197, 94, 0.1); }
        .toast.error { border-color: rgba(239, 68, 68, 0.5); background: rgba(239, 68, 68, 0.1); }
        .toast.owner { border-color: var(--owner-color); background: rgba(251, 191, 36, 0.15); color: var(--owner-color); }
    </style>
</head>
<body>
    <!-- 动态背景 -->
    <div class="gradient-bg">
        <div class="gradient-sphere sphere-1"></div>
        <div class="gradient-sphere sphere-2"></div>
        <div class="gradient-sphere sphere-3"></div>
    </div>

    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-brand">
            <img src="images/ZiQiu.jpg" alt="子秋" class="brand-logo">
            <span class="brand-text">子秋博客</span>
        </div>
        <ul class="nav-menu">
            <li><a href="index.html" class="nav-link">首页</a></li>
            <li><a href="jieshao.html" class="nav-link">介绍</a></li>
            <li><a href="text.html" class="nav-link">文章</a></li>
            <li><a href="vlog.html" class="nav-link">Vlog</a></li>
            <li><a href="guestbook.html" class="nav-link active">留言</a></li>
        </ul>
        <div class="hamburger">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
    </nav>

    <!-- 主体 -->
    <main class="guestbook-section">
        <!-- 头部 -->
        <header class="guestbook-header">
            <div class="guestbook-badge">💬 互动交流</div>
            <h1 class="guestbook-title">
                <span class="gradient-text">留言</span>墙
            </h1>
            <p class="guestbook-subtitle">
                欢迎留言交流！每一条留言所有人都能看到 👋
            </p>
        </header>

        <!-- 连接状态 -->
        <div class="connection-status">
            <div class="status-badge syncing" id="statusBadge">
                <span class="status-dot"></span>
                <span id="statusText">正在连接服务器...</span>
            </div>
            <button class="sync-btn-small" onclick="manualSync()" id="syncBtn">
                <span>🔄</span>
                <span>刷新</span>
            </button>
        </div>

        <!-- 身份切换 -->
        <div class="identity-switch">
            <div class="switch-container">
                <span class="switch-label" id="visitorLabel">访客模式</span>
                <button class="switch-btn" id="identitySwitch" onclick="toggleIdentity()">
                    <div class="switch-thumb"></div>
                </button>
                <span class="switch-label" id="ownerLabel">博主模式</span>
            </div>
        </div>

        <!-- 输入区 -->
        <section class="input-section" id="inputSection">
            <div class="input-header">
                <div class="input-icon" id="inputIcon">✍️</div>
                <h2 class="input-title">
                    写下你的留言
                    <span class="owner-indicator" id="ownerIndicator">👑 博主</span>
                </h2>
            </div>
            <form class="input-form" id="messageForm">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">你的昵称</label>
                        <input type="text" class="form-input" id="nickname" placeholder="怎么称呼你？" maxlength="20" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">联系邮箱（选填）</label>
                        <input type="email" class="form-input" id="email" placeholder="example@email.com">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">留言内容</label>
                    <textarea class="form-textarea" id="message" placeholder="想对子秋说什么？" maxlength="500" required></textarea>
                    <div class="char-count"><span id="charCount">0</span>/500</div>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span>🚀</span>
                    <span>发布留言</span>
                </button>
            </form>
        </section>

        <!-- 统计 -->
        <div class="wall-stats">
            <div class="stat-box">
                <span class="stat-number" id="totalCount">-</span>
                <span class="stat-label">总留言</span>
            </div>
            <div class="stat-box">
                <span class="stat-number" id="todayCount">-</span>
                <span class="stat-label">今日新增</span>
            </div>
            <div class="stat-box">
                <span class="stat-number" id="likeCount">-</span>
                <span class="stat-label">获赞总数</span>
            </div>
        </div>

        <!-- 图例 -->
        <div class="legend">
            <div class="legend-item">
                <div class="legend-dot visitor"></div>
                <span>访客留言</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot owner"></div>
                <span>博主回复</span>
            </div>
        </div>

        <!-- 留言墙 -->
        <section class="wall-section">
            <div class="wall-header">
                <h2 class="wall-title">
                    <span>📌</span>
                    <span>最新留言</span>
                </h2>
                <div class="wall-filter">
                    <button class="filter-btn active" data-filter="all">全部</button>
                    <button class="filter-btn" data-filter="new">最新</button>
                    <button class="filter-btn" data-filter="hot">热门</button>
                    <button class="filter-btn" data-filter="owner">博主</button>
                </div>
            </div>
            
            <div class="masonry-grid" id="messageWall">
                <div class="empty-state">
                    <div class="loading-spinner"></div>
                    <p>正在从服务器加载留言...</p>
                </div>
            </div>

            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-icon">📭</div>
                <p class="empty-text">还没有留言，快来抢沙发吧！</p>
            </div>
        </section>
    </main>

    <!-- 提示 -->
    <div class="toast" id="toast">
        <span id="toastIcon">✅</span>
        <span id="toastMessage">操作成功</span>
    </div>

    <script>
        // ==================== 配置区域 ====================
        // 请修改为你的 JSONBin 配置
        const JSONBIN_API_KEY = '$2a$10$GBi6c713S7MOpeD2wBwuouzdWG7OMOxsp5qQcR1Q8/76X7fQ7/yfq'; // 替换为你的 JSONBin Master Key
        const JSONBIN_BIN_ID = '69acefb6d0ea881f40fb2729'; // 替换为你的 Bin ID
        
        // 备用：如果 JSONBin 未配置，使用本地存储模式
        const USE_LOCAL_MODE = false;
        
        // 博主配置
        const OWNER_KEY = 'qn120922';
        const OWNER_NAME = '子秋';
        let isOwnerMode = false;
        let isOnline = false;
        let messages = [];
        let lastSyncTime = 0;

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', () => {
            initApp();
        });

        async function initApp() {
            // 检查连接状态
            updateStatus('syncing', '正在连接服务器...');
            
            if (USE_LOCAL_MODE) {
                // 本地模式
                updateStatus('offline', '本地模式（数据仅当前设备可见）');
                messages = JSON.parse(localStorage.getItem('guestbookMessages')) || [];
                if (messages.length === 0) {
                    loadDemoData();
                } else {
                    renderMessages();
                    updateStats();
                }
            } else {
                // JSONBin 云端模式
                try {
                    await syncFromCloud();
                    isOnline = true;
                    updateStatus('online', '已连接到云端（所有人可见）');
                    
                    // 定时同步（每30秒）
                    setInterval(autoSync, 30000);
                } catch (error) {
                    console.error('连接失败:', error);
                    updateStatus('offline', '连接失败，使用本地备份');
                    
                    // 使用本地备份
                    messages = JSON.parse(localStorage.getItem('guestbookBackup')) || [];
                    if (messages.length === 0) loadDemoData();
                    else {
                        renderMessages();
                        updateStats();
                    }
                }
            }
            
            // 初始化事件监听
            initEventListeners();
        }

        // ==================== JSONBin API 操作 ====================
        
        // 从云端同步数据
        async function syncFromCloud() {
            const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                method: 'GET',
                headers: {
                    'X-Master-Key': JSONBIN_API_KEY
                }
            });
            
            if (!response.ok) throw new Error('获取数据失败');
            
            const data = await response.json();
            messages = data.record?.messages || [];
            
            // 保存本地备份
            localStorage.setItem('guestbookBackup', JSON.stringify(messages));
            
            renderMessages();
            updateStats();
            lastSyncTime = Date.now();
            
            return messages;
        }

        // 同步到云端
        async function syncToCloud() {
            const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': JSONBIN_API_KEY
                },
                body: JSON.stringify({ messages: messages })
            });
            
            if (!response.ok) throw new Error('保存失败');
            
            // 更新本地备份
            localStorage.setItem('guestbookBackup', JSON.stringify(messages));
            
            return await response.json();
        }

        // 自动同步
        async function autoSync() {
            if (!isOnline || !USE_LOCAL_MODE) return;
            
            try {
                await syncFromCloud();
                console.log('自动同步完成');
            } catch (error) {
                console.log('自动同步失败:', error);
            }
        }

        // 手动刷新
        async function manualSync() {
            const btn = document.getElementById('syncBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner" style="width:16px;height:16px;border-width:2px;"></span><span>刷新中...</span>';
            
            try {
                if (USE_LOCAL_MODE) {
                    // 本地模式只是重新渲染
                    renderMessages();
                    showToast('已刷新', 'success');
                } else {
                    await syncFromCloud();
                    showToast('已同步最新留言', 'success');
                }
            } catch (error) {
                showToast('同步失败: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>🔄</span><span>刷新</span>';
            }
        }

        // ==================== 本地存储模式 ====================
        
        function saveToLocal() {
            localStorage.setItem('guestbookMessages', JSON.stringify(messages));
            localStorage.setItem('guestbookBackup', JSON.stringify(messages));
        }

        // ==================== UI 更新 ====================
        
        function updateStatus(type, text) {
            const badge = document.getElementById('statusBadge');
            const statusText = document.getElementById('statusText');
            
            badge.className = `status-badge ${type}`;
            statusText.textContent = text;
        }

        function initEventListeners() {
            // 导航栏
            window.addEventListener('scroll', () => {
                document.querySelector('.navbar').classList.toggle('scrolled', window.scrollY > 50);
            });

            document.querySelector('.hamburger').addEventListener('click', () => {
                document.querySelector('.nav-menu').classList.toggle('active');
            });

            // 字符计数
            document.getElementById('message').addEventListener('input', (e) => {
                document.getElementById('charCount').textContent = e.target.value.length;
            });

            // 表单提交
            document.getElementById('messageForm').addEventListener('submit', handleSubmit);

            // 筛选按钮
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderMessages(btn.dataset.filter);
                });
            });
        }

        // ==================== 身份切换 ====================
        
        function toggleIdentity() {
            const switchBtn = document.getElementById('identitySwitch');
            const visitorLabel = document.getElementById('visitorLabel');
            const ownerLabel = document.getElementById('ownerLabel');
            const inputSection = document.getElementById('inputSection');
            const ownerIndicator = document.getElementById('ownerIndicator');
            const submitBtn = document.getElementById('submitBtn');
            const nickname = document.getElementById('nickname');

            isOwnerMode = !isOwnerMode;

            if (isOwnerMode) {
                const key = prompt('请输入博主密钥：');
                if (key !== OWNER_KEY) {
                    alert('密钥错误！');
                    isOwnerMode = false;
                    return;
                }

                switchBtn.classList.add('owner-mode');
                visitorLabel.classList.remove('active');
                ownerLabel.classList.add('active');
                inputSection.classList.add('owner-mode');
                ownerIndicator.classList.add('show');
                submitBtn.classList.add('owner-submit');
                
                nickname.value = OWNER_NAME;
                nickname.readOnly = true;
                
                showToast('已切换到博主模式', 'owner');
            } else {
                switchBtn.classList.remove('owner-mode');
                visitorLabel.classList.add('active');
                ownerLabel.classList.remove('active');
                inputSection.classList.remove('owner-mode');
                ownerIndicator.classList.remove('show');
                submitBtn.classList.remove('owner-submit');
                
                nickname.value = '';
                nickname.readOnly = false;
                
                showToast('已切换到访客模式', 'success');
            }
        }

        document.getElementById('visitorLabel').classList.add('active');

        // ==================== 留言操作 ====================
        
        async function handleSubmit(e) {
            e.preventDefault();
            
            const nickname = document.getElementById('nickname').value.trim();
            const content = document.getElementById('message').value.trim();

            if (!nickname || !content) {
                showToast('请填写完整信息', 'error');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading-spinner" style="width:16px;height:16px;border-width:2px;"></span><span>发布中...</span>';

            const newMessage = {
                id: Date.now(),
                nickname: nickname,
                avatar: nickname.charAt(0).toUpperCase(),
                content: content,
                time: new Date().toISOString(),
                likes: 0,
                isLiked: false,
                isNew: true,
                isOwner: isOwnerMode
            };

            try {
                // 添加到本地数组
                messages.unshift(newMessage);
                
                if (USE_LOCAL_MODE) {
                    // 本地模式
                    saveToLocal();
                } else {
                    // 云端模式
                    await syncToCloud();
                }

                // 重置表单
                if (!isOwnerMode) {
                    document.getElementById('nickname').value = '';
                }
                document.getElementById('message').value = '';
                document.getElementById('charCount').textContent = '0';

                showToast(isOwnerMode ? '博主回复已发布！' : '留言发布成功！', isOwnerMode ? 'owner' : 'success');
                
                renderMessages();
                updateStats();

                // 3秒后移除 new 标记
                setTimeout(() => {
                    newMessage.isNew = false;
                    if (USE_LOCAL_MODE) saveToLocal();
                }, 3000);

            } catch (error) {
                console.error('发布失败:', error);
                showToast('发布失败: ' + error.message, 'error');
                // 从数组中移除
                messages.shift();
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>🚀</span><span>发布留言</span>';
            }
        }

        async function toggleLike(id) {
            const msg = messages.find(m => m.id === id);
            if (!msg) return;
            
            if (msg.isLiked) {
                msg.likes--;
                msg.isLiked = false;
            } else {
                msg.likes++;
                msg.isLiked = true;
            }
            
            try {
                if (USE_LOCAL_MODE) {
                    saveToLocal();
                } else {
                    await syncToCloud();
                }
                
                renderMessages(document.querySelector('.filter-btn.active').dataset.filter);
                updateStats();
            } catch (error) {
                showToast('操作失败', 'error');
                // 回滚
                if (msg.isLiked) {
                    msg.likes--;
                    msg.isLiked = false;
                } else {
                    msg.likes++;
                    msg.isLiked = true;
                }
            }
        }

        function replyMessage(nickname) {
            document.getElementById('message').value = `@${nickname} `;
            document.getElementById('message').focus();
            document.querySelector('.input-section').scrollIntoView({ behavior: 'smooth' });
        }

        // ==================== 渲染 ====================
        
        function renderMessages(filter = 'all') {
            const wall = document.getElementById('messageWall');
            const emptyState = document.getElementById('emptyState');

            let displayMessages = [...messages];
            
            if (filter === 'new') {
                displayMessages.sort((a, b) => new Date(b.time) - new Date(a.time));
            } else if (filter === 'hot') {
                displayMessages.sort((a, b) => b.likes - a.likes);
            } else if (filter === 'owner') {
                displayMessages = displayMessages.filter(m => m.isOwner);
            }

            if (displayMessages.length === 0) {
                wall.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            
            wall.innerHTML = displayMessages.map(msg => {
                const isOwner = msg.isOwner;
                const cardClass = isOwner ? 'owner-message' : '';
                const avatarClass = isOwner ? 'owner-avatar' : '';
                const nameClass = isOwner ? 'owner-name' : '';
                const badgeHtml = isOwner ? '<span class="owner-badge">👑 博主</span>' : '';
                const newBadge = msg.isNew ? '<span class="message-badge">NEW</span>' : '';

                return `
                    <div class="message-card ${cardClass} ${msg.isNew ? 'new' : ''}" data-id="${msg.id}">
                        <div class="message-header">
                            <div class="message-author">
                                <div class="author-avatar ${avatarClass}">${msg.avatar}</div>
                                <div class="author-info">
                                    <span class="author-name ${nameClass}">
                                        ${escapeHtml(msg.nickname)}
                                        ${badgeHtml}
                                    </span>
                                    <span class="message-time">${formatTime(msg.time)}</span>
                                </div>
                            </div>
                            ${newBadge}
                        </div>
                        <div class="message-content">${escapeHtml(msg.content)}</div>
                        <div class="message-footer">
                            <button class="action-btn ${msg.isLiked ? 'liked' : ''}" onclick="toggleLike(${msg.id})">
                                <span>${msg.isLiked ? '❤️' : '🤍'}</span>
                                <span>${msg.likes}</span>
                            </button>
                            ${!isOwner ? `
                            <button class="action-btn" onclick="replyMessage('${escapeHtml(msg.nickname)}')">
                                <span>💬</span>
                                <span>回复</span>
                            </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = messages.length;
            
            const today = new Date().toDateString();
            const todayCount = messages.filter(m => new Date(m.time).toDateString() === today).length;
            document.getElementById('todayCount').textContent = todayCount;
            
            const totalLikes = messages.reduce((sum, m) => sum + m.likes, 0);
            document.getElementById('likeCount').textContent = totalLikes;
        }

        // ==================== 工具函数 ====================
        
        function loadDemoData() {
            const demoData = [
                {
                    id: 1001,
                    nickname: '小明',
                    avatar: '明',
                    content: '子秋你好！博客设计得太酷了，特别是那个玻璃拟态效果，能教教我怎么做吗？',
                    time: new Date(Date.now() - 86400000 * 2).toISOString(),
                    likes: 12,
                    isLiked: false,
                    isNew: false,
                    isOwner: false
                },
                {
                    id: 1002,
                    nickname: OWNER_NAME,
                    avatar: '子',
                    content: '谢谢小明的喜欢！玻璃拟态效果其实很简单，主要是用 backdrop-filter: blur() 和半透明背景。我后面会写一篇教程详细讲解～',
                    time: new Date(Date.now() - 86400000 * 2 + 3600000).toISOString(),
                    likes: 28,
                    isLiked: false,
                    isNew: false,
                    isOwner: true
                },
                {
                    id: 1003,
                    nickname: '前端爱好者',
                    avatar: '前',
                    content: '六年级就能做出这么棒的网站，太厉害了！继续加油，未来可期！💪',
                    time: new Date(Date.now() - 86400000).toISOString(),
                    likes: 8,
                    isLiked: false,
                    isNew: false,
                    isOwner: false
                }
            ];
            
            messages = demoData;
            if (USE_LOCAL_MODE) saveToLocal();
            renderMessages();
            updateStats();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(timeString) {
            const date = new Date(timeString);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 3600000) {
                const minutes = Math.floor(diff / 60000);
                return minutes < 1 ? '刚刚' : `${minutes}分钟前`;
            }
            if (diff < 86400000) {
                return `${Math.floor(diff / 3600000)}小时前`;
            }
            if (diff < 604800000) {
                return `${Math.floor(diff / 86400000)}天前`;
            }
            
            return date.toLocaleDateString('zh-CN');
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const msg = document.getElementById('toastMessage');
            
            toast.className = `toast ${type}`;
            icon.textContent = type === 'owner' ? '👑' : (type === 'error' ? '❌' : '✅');
            msg.textContent = message;
            
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>

</html>
