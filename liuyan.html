<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言墙 | 子秋博客</title>
    <link rel="shortcut icon" href="./images/ZiQiu.jpg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* 基础变量 */
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --secondary-color: #ec4899;
            --accent-color: #f59e0b;
            --owner-color: #fbbf24; /* 博客主专属金色 */
            --owner-glow: rgba(251, 191, 36, 0.4);
            --bg-dark: #0f172a;
            --bg-light: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* 动态背景 */
        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .gradient-sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 20s infinite ease-in-out;
        }

        .sphere-1 {
            width: 600px;
            height: 600px;
            background: linear-gradient(45deg, #6366f1, #a855f7);
            top: -200px;
            right: -100px;
            animation-delay: 0s;
        }

        .sphere-2 {
            width: 400px;
            height: 400px;
            background: linear-gradient(45deg, #ec4899, #f43f5e);
            bottom: -100px;
            left: -100px;
            animation-delay: -5s;
        }

        .sphere-3 {
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #f59e0b, #f97316);
            top: 50%;
            left: 50%;
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* 导航栏 - 玻璃拟态 */
        .navbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: var(--glass-shadow);
            transition: var(--transition);
        }

        .navbar.scrolled {
            top: 10px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(30px);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.3s;
        }

        .brand-logo:hover {
            transform: rotate(360deg) scale(1.1);
        }

        .brand-text {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 8px;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 500;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .nav-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(236, 72, 153, 0.2));
            opacity: 0;
            transition: opacity 0.3s;
            z-index: -1;
        }

        .nav-link:hover::before,
        .nav-link.active::before {
            opacity: 1;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        /* 汉堡菜单 */
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
        }

        .bar {
            width: 25px;
            height: 3px;
            background: var(--text-primary);
            border-radius: 3px;
            transition: var(--transition);
        }

        /* 留言页面主体 */
        .guestbook-section {
            min-height: 100vh;
            padding: 120px 5% 60px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 页面头部 */
        .guestbook-header {
            text-align: center;
            margin-bottom: 48px;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .guestbook-badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(236, 72, 153, 0.2);
            border: 1px solid rgba(236, 72, 153, 0.4);
            border-radius: 20px;
            font-size: 0.875rem;
            color: #f9a8d4;
            margin-bottom: 16px;
        }

        .guestbook-title {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #f093fb 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient 3s linear infinite;
        }

        @keyframes gradient {
            to { background-position: 200% center; }
        }

        .guestbook-subtitle {
            color: var(--text-secondary);
            font-size: 1.125rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* 身份切换开关 */
        .identity-switch {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
            animation: fadeInUp 0.8s ease-out 0.05s both;
        }

        .switch-container {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
        }

        .switch-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            padding: 0 8px;
        }

        .switch-label.active {
            color: var(--owner-color);
            font-weight: 600;
        }

        .switch-btn {
            position: relative;
            width: 56px;
            height: 28px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            outline: none;
        }

        .switch-btn.owner-mode {
            background: linear-gradient(135deg, var(--owner-color), #f59e0b);
            box-shadow: 0 0 20px var(--owner-glow);
        }

        .switch-thumb {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .switch-btn.owner-mode .switch-thumb {
            transform: translateX(28px);
        }

        /* 输入区域 - 玻璃拟态 */
        .input-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 48px;
            animation: fadeInUp 0.8s ease-out 0.1s both;
            box-shadow: var(--glass-shadow);
            transition: var(--transition);
        }

        .input-section.owner-mode {
            border-color: var(--owner-color);
            box-shadow: 0 0 30px var(--owner-glow), var(--glass-shadow);
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.05), rgba(255, 255, 255, 0.05));
        }

        .input-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .input-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: var(--transition);
        }

        .input-section.owner-mode .input-icon {
            background: linear-gradient(135deg, var(--owner-color), #f59e0b);
            box-shadow: 0 0 20px var(--owner-glow);
        }

        .input-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .owner-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: linear-gradient(135deg, var(--owner-color), #f59e0b);
            border-radius: 20px;
            font-size: 0.75rem;
            color: #0f172a;
            font-weight: 700;
            margin-left: 12px;
            opacity: 0;
            transform: scale(0.8);
            transition: var(--transition);
        }

        .owner-indicator.show {
            opacity: 1;
            transform: scale(1);
        }

        .input-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-input,
        .form-textarea {
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: var(--transition);
            outline: none;
        }

        .form-input::placeholder,
        .form-textarea::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .form-input:focus,
        .form-textarea:focus {
            border-color: var(--primary-color);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .input-section.owner-mode .form-input:focus,
        .input-section.owner-mode .form-textarea:focus {
            border-color: var(--owner-color);
            box-shadow: 0 0 0 3px var(--owner-glow);
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .char-count {
            text-align: right;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .submit-btn {
            align-self: flex-start;
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6);
        }

        .submit-btn.owner-submit {
            background: linear-gradient(135deg, var(--owner-color), #f59e0b);
            box-shadow: 0 4px 15px var(--owner-glow);
            color: #0f172a;
        }

        .submit-btn.owner-submit:hover {
            box-shadow: 0 8px 25px var(--owner-glow);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 留言墙统计 */
        .wall-stats {
            display: flex;
            justify-content: center;
            gap: 48px;
            margin-bottom: 32px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .stat-box {
            text-align: center;
            padding: 20px 32px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* 留言墙 */
        .wall-section {
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }

        .wall-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .wall-title {
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .wall-filter {
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: var(--text-secondary);
            font-size: 0.875rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.5);
            color: var(--text-primary);
        }

        /* 瀑布流布局 */
        .masonry-grid {
            column-count: 3;
            column-gap: 24px;
        }

        /* 留言卡片 - 玻璃拟态 */
        .message-card {
            break-inside: avoid;
            margin-bottom: 24px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px;
            transition: var(--transition);
            animation: slideIn 0.5s ease-out;
            position: relative;
            overflow: hidden;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-card:hover {
            transform: translateY(-4px);
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .message-card.new {
            border-color: rgba(236, 72, 153, 0.5);
            animation: pulse-border 2s infinite;
        }

        @keyframes pulse-border {
            0%, 100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(236, 72, 153, 0); }
        }

        /* 博客主专属样式 */
        .message-card.owner-message {
            border-color: var(--owner-color);
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.1), rgba(255, 255, 255, 0.05));
            box-shadow: 0 0 20px var(--owner-glow), 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .message-card.owner-message::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, var(--owner-color), #f59e0b);
        }

        .message-card.owner-message:hover {
            border-color: var(--owner-color);
            box-shadow: 0 0 30px var(--owner-glow), 0 20px 40px rgba(0, 0, 0, 0.4);
            transform: translateY(-6px) scale(1.02);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .message-author {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .author-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            position: relative;
        }

        /* 博客主头像特殊样式 */
        .author-avatar.owner-avatar {
            background: linear-gradient(135deg, var(--owner-color), #f59e0b);
            box-shadow: 0 0 15px var(--owner-glow);
            border: 2px solid var(--owner-color);
        }

        .author-avatar.owner-avatar::after {
            content: '👑';
            position: absolute;
            bottom: -4px;
            right: -4px;
            font-size: 0.75rem;
            background: var(--owner-color);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg-dark);
        }

        .author-info {
            display: flex;
            flex-direction: column;
        }

        .author-name {
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 博客主名字金色 */
        .author-name.owner-name {
            background: linear-gradient(135deg, var(--owner-color), #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .owner-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            background: linear-gradient(135deg, var(--owner-color), #f59e0b);
            border-radius: 6px;
            font-size: 0.625rem;
            color: #0f172a;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .message-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .message-badge {
            padding: 4px 10px;
            background: rgba(99, 102, 241, 0.15);
            border-radius: 12px;
            font-size: 0.75rem;
            color: #a5b4fc;
        }

        .message-content {
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 16px;
            word-wrap: break-word;
        }

        /* 博客主留言内容更亮 */
        .message-card.owner-message .message-content {
            color: #e2e8f0;
            font-weight: 500;
        }

        .message-footer {
            display: flex;
            gap: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: var(--text-secondary);
            font-size: 0.875rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .action-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.3);
            color: var(--text-primary);
            transform: scale(1.05);
        }

        .action-btn.liked {
            background: rgba(236, 72, 153, 0.2);
            border-color: rgba(236, 72, 153, 0.5);
            color: #f9a8d4;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-text {
            font-size: 1.125rem;
        }

        /* 图例说明 */
        .legend {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .legend-dot.visitor {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        }

        .legend-dot.owner {
            background: linear-gradient(135deg, var(--owner-color), #f59e0b);
            box-shadow: 0 0 10px var(--owner-glow);
        }

        /* 响应式 */
        @media (max-width: 968px) {
            .guestbook-title {
                font-size: 2.5rem;
            }

            .masonry-grid {
                column-count: 2;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .wall-stats {
                gap: 24px;
            }

            .stat-box {
                padding: 16px 24px;
            }
        }

        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }

            .nav-menu {
                position: fixed;
                left: -100%;
                top: 80px;
                flex-direction: column;
                background: rgba(15, 23, 42, 0.98);
                width: 90%;
                margin: 0 5%;
                text-align: center;
                transition: 0.3s;
                border-radius: 16px;
                padding: 20px;
                box-shadow: var(--glass-shadow);
                border: 1px solid var(--glass-border);
            }

            .nav-menu.active {
                left: 0;
            }

            .nav-link {
                padding: 16px;
                display: block;
            }

            .navbar {
                width: 95%;
                top: 10px;
            }

            .masonry-grid {
                column-count: 1;
            }

            .input-section {
                padding: 24px;
            }

            .wall-header {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }

            .wall-filter {
                width: 100%;
                overflow-x: auto;
                padding-bottom: 8px;
            }

            .guestbook-section {
                padding-top: 100px;
            }

            .identity-switch {
                padding: 0 20px;
            }

            .switch-container {
                width: 100%;
                justify-content: center;
            }

            .legend {
                gap: 16px;
            }
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--primary-color), var(--secondary-color));
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(var(--primary-hover), var(--secondary-color));
        }

        /* 提示消息 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 16px 24px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-primary);
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: all 0.3s;
            z-index: 3000;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-color: rgba(34, 197, 94, 0.5);
            background: rgba(34, 197, 94, 0.1);
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.5);
            background: rgba(239, 68, 68, 0.1);
        }

        .toast.owner-toast {
            border-color: var(--owner-color);
            background: rgba(251, 191, 36, 0.15);
            color: var(--owner-color);
        }
    </style>
</head>
<body>
    <!-- 动态背景 -->
    <div class="gradient-bg">
        <div class="gradient-sphere sphere-1"></div>
        <div class="gradient-sphere sphere-2"></div>
        <div class="gradient-sphere sphere-3"></div>
    </div>

    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-brand">
            <img src="images/ZiQiu.jpg" alt="子秋" class="brand-logo">
            <span class="brand-text">子秋博客</span>
        </div>
        <ul class="nav-menu">
            <li><a href="index.html" class="nav-link">首页</a></li>
            <li><a href="jieshao.html" class="nav-link">介绍</a></li>
            <li><a href="text.html" class="nav-link">文章</a></li>
            <li><a href="vlog.html" class="nav-link">Vlog</a></li>
            <li><a href="liuyan.html" class="nav-link active">留言</a></li>
        </ul>
        <div class="hamburger">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
    </nav>

    <!-- 留言页面主体 -->
    <main class="guestbook-section">
        <!-- 页面头部 -->
        <header class="guestbook-header">
            <div class="guestbook-badge">💬 互动交流</div>
            <h1 class="guestbook-title">
                <span class="gradient-text">留言</span>墙
            </h1>
            <p class="guestbook-subtitle">
                欢迎留言交流！分享你的想法、建议或只是打个招呼 👋
                <br>每一条留言我都会认真阅读
            </p>
        </header>

        <!-- 身份切换 -->
        <div class="identity-switch">
            <div class="switch-container">
                <span class="switch-label" id="visitorLabel">访客模式</span>
                <button class="switch-btn" id="identitySwitch" onclick="toggleIdentity()">
                    <div class="switch-thumb"></div>
                </button>
                <span class="switch-label" id="ownerLabel">博主模式</span>
            </div>
        </div>

        <!-- 输入区域 -->
        <section class="input-section" id="inputSection">
            <div class="input-header">
                <div class="input-icon" id="inputIcon">✍️</div>
                <h2 class="input-title">
                    写下你的留言
                    <span class="owner-indicator" id="ownerIndicator">👑 博主</span>
                </h2>
            </div>
            <form class="input-form" id="messageForm">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">你的昵称</label>
                        <input type="text" class="form-input" id="nickname" placeholder="怎么称呼你？" maxlength="20" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">联系邮箱（选填）</label>
                        <input type="email" class="form-input" id="email" placeholder="example@email.com">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">留言内容</label>
                    <textarea class="form-textarea" id="message" placeholder="想对子秋说什么？可以分享你的想法、建议，或者打个招呼..." maxlength="500" required></textarea>
                    <div class="char-count"><span id="charCount">0</span>/500</div>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span>🚀</span>
                    <span>发布留言</span>
                </button>
            </form>
        </section>

        <!-- 统计信息 -->
        <div class="wall-stats">
            <div class="stat-box">
                <span class="stat-number" id="totalCount">0</span>
                <span class="stat-label">总留言</span>
            </div>
            <div class="stat-box">
                <span class="stat-number" id="todayCount">0</span>
                <span class="stat-label">今日新增</span>
            </div>
            <div class="stat-box">
                <span class="stat-number" id="likeCount">0</span>
                <span class="stat-label">获赞总数</span>
            </div>
        </div>

        <!-- 图例 -->
        <div class="legend">
            <div class="legend-item">
                <div class="legend-dot visitor"></div>
                <span>访客留言</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot owner"></div>
                <span>博主回复</span>
            </div>
        </div>

        <!-- 留言墙 -->
        <section class="wall-section">
            <div class="wall-header">
                <h2 class="wall-title">
                    <span>📌</span>
                    <span>最新留言</span>
                </h2>
                <div class="wall-filter">
                    <button class="filter-btn active" data-filter="all">全部</button>
                    <button class="filter-btn" data-filter="new">最新</button>
                    <button class="filter-btn" data-filter="hot">热门</button>
                    <button class="filter-btn" data-filter="owner">博主</button>
                </div>
            </div>
            
            <div class="masonry-grid" id="messageWall">
                <!-- 留言卡片会通过 JS 动态插入 -->
            </div>

            <!-- 空状态（默认隐藏） -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-icon">📭</div>
                <p class="empty-text">还没有留言，快来抢沙发吧！</p>
            </div>
        </section>
    </main>

    <!-- 提示消息 -->
    <div class="toast" id="toast">
        <span id="toastIcon">✅</span>
        <span id="toastMessage">操作成功</span>
    </div>

    <script>
        // 全局状态
        let isOwnerMode = false;
        const OWNER_NAME = '子秋';
        const OWNER_AVATAR = '子';
        const OWNER_KEY = '120922'; // 博主密钥已修改为 120922

        // 导航栏滚动效果
        window.addEventListener('scroll', () => {
            const navbar = document.querySelector('.navbar');
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // 移动端菜单
        const hamburger = document.querySelector('.hamburger');
        const navMenu = document.querySelector('.nav-menu');
        
        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            navMenu.classList.toggle('active');
        });

        // 身份切换
        function toggleIdentity() {
            const switchBtn = document.getElementById('identitySwitch');
            const visitorLabel = document.getElementById('visitorLabel');
            const ownerLabel = document.getElementById('ownerLabel');
            const inputSection = document.getElementById('inputSection');
            const inputIcon = document.getElementById('inputIcon');
            const ownerIndicator = document.getElementById('ownerIndicator');
            const submitBtn = document.getElementById('submitBtn');
            const nickname = document.getElementById('nickname');

            isOwnerMode = !isOwnerMode;

            if (isOwnerMode) {
                // 验证博主身份
                const key = prompt('请输入博主密钥：');
                if (key !== OWNER_KEY) {
                    alert('密钥错误！');
                    isOwnerMode = false;
                    return;
                }

                switchBtn.classList.add('owner-mode');
                visitorLabel.classList.remove('active');
                ownerLabel.classList.add('active');
                inputSection.classList.add('owner-mode');
                ownerIndicator.classList.add('show');
                submitBtn.classList.add('owner-submit');
                
                // 自动填充博主信息
                nickname.value = OWNER_NAME;
                nickname.readOnly = true;
                
                showToast('已切换到博主模式', 'owner-toast');
            } else {
                switchBtn.classList.remove('owner-mode');
                visitorLabel.classList.add('active');
                ownerLabel.classList.remove('active');
                inputSection.classList.remove('owner-mode');
                ownerIndicator.classList.remove('show');
                submitBtn.classList.remove('owner-submit');
                
                // 清空信息
                nickname.value = '';
                nickname.readOnly = false;
                
                showToast('已切换到访客模式', 'success');
            }
        }

        // 默认访客模式标签激活
        document.getElementById('visitorLabel').classList.add('active');

        // 留言数据存储
        let messages = JSON.parse(localStorage.getItem('guestbookMessages')) || [];

        // 初始示例数据
        if (messages.length === 0) {
            messages = [
                {
                    id: 1,
                    nickname: '小明',
                    avatar: '明',
                    content: '子秋你好！博客设计得太酷了，特别是那个玻璃拟态效果，能教教我怎么做吗？',
                    time: new Date(Date.now() - 86400000 * 2).toISOString(),
                    likes: 12,
                    isLiked: false,
                    isNew: false,
                    isOwner: false
                },
                {
                    id: 2,
                    nickname: OWNER_NAME,
                    avatar: OWNER_AVATAR,
                    content: '谢谢小明的喜欢！玻璃拟态效果其实很简单，主要是用 backdrop-filter: blur() 和半透明背景。',
                    time: new Date(Date.now() - 86400000 * 2 + 3600000).toISOString(),
                    likes: 28,
                    isLiked: false,
                    isNew: false,
                    isOwner: true
                },
                {
                    id: 3,
                    nickname: '前端爱好者',
                    avatar: '前',
                    content: '七年级就能做出这么棒的网站，太厉害了！继续加油，未来可期！💪',
                    time: new Date(Date.now() - 86400000).toISOString(),
                    likes: 8,
                    isLiked: false,
                    isNew: false,
                    isOwner: false
                },
                {
                    id: 4,
                    nickname: OWNER_NAME,
                    avatar: OWNER_AVATAR,
                    content: '感谢支持！我会继续努力学习的，也欢迎大家多提建议，一起进步！🚀',
                    time: new Date(Date.now() - 86400000 + 1800000).toISOString(),
                    likes: 15,
                    isLiked: false,
                    isNew: false,
                    isOwner: true
                },
                {
                    id: 5,
                    nickname: '路过的大佬',
                    avatar: '路',
                    content: '代码结构很清晰，动画效果也很流畅。建议可以加上暗黑模式切换功能，会更酷！',
                    time: new Date(Date.now() - 3600000 * 5).toISOString(),
                    likes: 5,
                    isLiked: false,
                    isNew: false,
                    isOwner: false
                }
            ];
            saveMessages();
        }

        function saveMessages() {
            localStorage.setItem('guestbookMessages', JSON.stringify(messages));
        }

        // 字符计数
        const messageInput = document.getElementById('message');
        const charCount = document.getElementById('charCount');
        
        messageInput.addEventListener('input', () => {
            charCount.textContent = messageInput.value.length;
        });

        // 提交表单
        const form = document.getElementById('messageForm');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const nickname = document.getElementById('nickname').value.trim();
            const email = document.getElementById('email').value.trim();
            const content = document.getElementById('message').value.trim();

            if (!nickname || !content) {
                showToast('请填写完整信息', 'error');
                return;
            }

            // 创建新留言
            const newMessage = {
                id: Date.now(),
                nickname: nickname,
                email: email,
                avatar: nickname.charAt(0).toUpperCase(),
                content: content,
                time: new Date().toISOString(),
                likes: 0,
                isLiked: false,
                isNew: true,
                isOwner: isOwnerMode // 标记是否为博主
            };

            // 添加到数组开头
            messages.unshift(newMessage);
            saveMessages();

            // 重置表单
            if (!isOwnerMode) {
                form.reset();
            } else {
                document.getElementById('message').value = '';
                document.getElementById('charCount').textContent = '0';
            }
            
            charCount.textContent = '0';

            // 显示成功提示
            if (isOwnerMode) {
                showToast('博主回复已发布！', 'owner-toast');
            } else {
                showToast('留言发布成功！', 'success');
            }

            // 重新渲染
            renderMessages();
            updateStats();

            // 3秒后移除 new 标记
            setTimeout(() => {
                newMessage.isNew = false;
                saveMessages();
                renderMessages();
            }, 3000);
        });

        // 渲染留言墙
        function renderMessages(filter = 'all') {
            const wall = document.getElementById('messageWall');
            const emptyState = document.getElementById('emptyState');

            // 筛选
            let displayMessages = [...messages];
            
            if (filter === 'new') {
                displayMessages.sort((a, b) => new Date(b.time) - new Date(a.time));
            } else if (filter === 'hot') {
                displayMessages.sort((a, b) => b.likes - a.likes);
            } else if (filter === 'owner') {
                displayMessages = displayMessages.filter(m => m.isOwner);
            }

            if (displayMessages.length === 0) {
                wall.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            
            wall.innerHTML = displayMessages.map(msg => {
                const isOwner = msg.isOwner;
                const cardClass = isOwner ? 'owner-message' : '';
                const avatarClass = isOwner ? 'owner-avatar' : '';
                const nameClass = isOwner ? 'owner-name' : '';
                const badgeHtml = isOwner ? '<span class="owner-badge">👑 博主</span>' : '';
                const newBadge = msg.isNew ? '<span class="message-badge">NEW</span>' : '';

                return `
                    <div class="message-card ${cardClass} ${msg.isNew ? 'new' : ''}" data-id="${msg.id}">
                        <div class="message-header">
                            <div class="message-author">
                                <div class="author-avatar ${avatarClass}">${msg.avatar}</div>
                                <div class="author-info">
                                    <span class="author-name ${nameClass}">
                                        ${escapeHtml(msg.nickname)}
                                        ${badgeHtml}
                                    </span>
                                    <span class="message-time">${formatTime(msg.time)}</span>
                                </div>
                            </div>
                            ${newBadge}
                        </div>
                        <div class="message-content">${escapeHtml(msg.content)}</div>
                        <div class="message-footer">
                            <button class="action-btn ${msg.isLiked ? 'liked' : ''}" onclick="toggleLike(${msg.id})">
                                <span>${msg.isLiked ? '❤️' : '🤍'}</span>
                                <span>${msg.likes}</span>
                            </button>
                            ${!isOwner ? `
                            <button class="action-btn" onclick="replyMessage('${escapeHtml(msg.nickname)}')">
                                <span>💬</span>
                                <span>回复</span>
                            </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 转义 HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 格式化时间
        function formatTime(timeString) {
            const date = new Date(timeString);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 3600000) {
                const minutes = Math.floor(diff / 60000);
                return minutes < 1 ? '刚刚' : `${minutes}分钟前`;
            }
            if (diff < 86400000) {
                return `${Math.floor(diff / 3600000)}小时前`;
            }
            if (diff < 604800000) {
                return `${Math.floor(diff / 86400000)}天前`;
            }
            
            return date.toLocaleDateString('zh-CN');
        }

        // 点赞
        function toggleLike(id) {
            const msg = messages.find(m => m.id === id);
            if (msg) {
                if (msg.isLiked) {
                    msg.likes--;
                    msg.isLiked = false;
                } else {
                    msg.likes++;
                    msg.isLiked = true;
                }
                saveMessages();
                renderMessages(document.querySelector('.filter-btn.active').dataset.filter);
                updateStats();
            }
        }

        // 回复
        function replyMessage(nickname) {
            const messageInput = document.getElementById('message');
            messageInput.value = `@${nickname} `;
            messageInput.focus();
            document.querySelector('.input-section').scrollIntoView({ behavior: 'smooth' });
        }

        // 更新统计
        function updateStats() {
            document.getElementById('totalCount').textContent = messages.length;
            
            const today = new Date().toDateString();
            const todayCount = messages.filter(m => new Date(m.time).toDateString() === today).length;
            document.getElementById('todayCount').textContent = todayCount;
            
            const totalLikes = messages.reduce((sum, m) => sum + m.likes, 0);
            document.getElementById('likeCount').textContent = totalLikes;
        }

        // 筛选
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderMessages(btn.dataset.filter);
            });
        });

        // 提示
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const msg = document.getElementById('toastMessage');
            
            toast.className = `toast ${type}`;
            
            if (type === 'owner-toast') {
                icon.textContent = '👑';
            } else {
                icon.textContent = type === 'success' ? '✅' : '❌';
            }
            
            msg.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // 初始化
        renderMessages();
        updateStats();
    </script>
</body>
</html>
