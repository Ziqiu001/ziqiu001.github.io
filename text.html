<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章 | 子秋博客</title>
    <link rel="shortcut icon" href="./images/ZiQiu.jpg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* 基础变量 */
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --secondary-color: #ec4899;
            --accent-color: #f59e0b;
            --owner-color: #fbbf24;
            --owner-glow: rgba(251, 191, 36, 0.4);
            --bg-dark: #0f172a;
            --bg-light: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* 动态背景 */
        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .gradient-sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 20s infinite ease-in-out;
        }

        .sphere-1 {
            width: 600px;
            height: 600px;
            background: linear-gradient(45deg, #6366f1, #a855f7);
            top: -200px;
            right: -100px;
        }

        .sphere-2 {
            width: 400px;
            height: 400px;
            background: linear-gradient(45deg, #ec4899, #f43f5e);
            bottom: -100px;
            left: -100px;
            animation-delay: -5s;
        }

        .sphere-3 {
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #f59e0b, #f97316);
            top: 50%;
            left: 50%;
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* 导航栏 */
        .navbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: var(--glass-shadow);
            transition: var(--transition);
        }

        .navbar.scrolled {
            top: 10px;
            background: rgba(15, 23, 42, 0.9);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.3s;
        }

        .brand-logo:hover {
            transform: rotate(360deg) scale(1.1);
        }

        .brand-text {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 8px;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 500;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .nav-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(236, 72, 153, 0.2));
            opacity: 0;
            transition: opacity 0.3s;
            z-index: -1;
        }

        .nav-link:hover::before,
        .nav-link.active::before {
            opacity: 1;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        /* 汉堡菜单 */
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
        }

        .bar {
            width: 25px;
            height: 3px;
            background: var(--text-primary);
            border-radius: 3px;
            transition: var(--transition);
        }

        /* 主体区域 */
        .blog-section {
            min-height: 100vh;
            padding: 120px 5% 60px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 页面头部 */
        .blog-header {
            text-align: center;
            margin-bottom: 48px;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .blog-badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.4);
            border-radius: 20px;
            font-size: 0.875rem;
            color: #a5b4fc;
            margin-bottom: 16px;
        }

        .blog-title {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #f093fb 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient 3s linear infinite;
        }

        @keyframes gradient {
            to { background-position: 200% center; }
        }

        .blog-subtitle {
            color: var(--text-secondary);
            font-size: 1.125rem;
        }

        /* 博主控制面板 */
        .owner-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px;
            margin-bottom: 48px;
            animation: fadeInUp 0.8s ease-out 0.1s both;
            display: none;
        }

        .owner-panel.active {
            display: block;
            border-color: var(--owner-color);
            box-shadow: 0 0 30px var(--owner-glow);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .panel-title {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .panel-title::before {
            content: '👑';
            font-size: 1.5rem;
        }

        .logout-btn {
            padding: 8px 16px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            color: #fca5a5;
            font-size: 0.875rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            transform: scale(1.05);
        }

        /* 编辑器 */
        .editor-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .editor-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-input,
        .form-select,
        .form-textarea {
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: var(--transition);
            outline: none;
        }

        .form-input::placeholder,
        .form-textarea::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: var(--owner-color);
            box-shadow: 0 0 0 3px var(--owner-glow);
            background: rgba(255, 255, 255, 0.08);
        }

        .form-textarea {
            min-height: 300px;
            resize: vertical;
            line-height: 1.8;
        }

        .editor-toolbar {
            display: flex;
            gap: 8px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            flex-wrap: wrap;
        }

        .tool-btn {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 0.875rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .tool-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.3);
            color: var(--text-primary);
        }

        .publish-btn {
            align-self: flex-start;
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--owner-color), #f59e0b);
            border: none;
            border-radius: 12px;
            color: #0f172a;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px var(--owner-glow);
        }

        .publish-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--owner-glow);
        }

        .publish-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 登录提示 */
        .login-prompt {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            margin-bottom: 48px;
            animation: fadeInUp 0.8s ease-out 0.1s both;
        }

        .login-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .login-text {
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .login-btn {
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6);
        }

        /* 分类标签区域 */
        .category-section {
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .category-title {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
            text-align: center;
        }

        /* 主分类 */
        .main-categories {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .category-btn {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-btn:hover,
        .category-btn.active {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.5);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .category-btn.active {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        /* 子分类 */
        .sub-categories {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .sub-category-btn {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .sub-category-btn:hover,
        .sub-category-btn.active {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            color: var(--text-primary);
        }

        /* 文章网格 */
        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }

        /* 文章卡片 */
        .article-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            overflow: hidden;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .article-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .article-cover {
            width: 100%;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .cover-icon {
            font-size: 3rem;
            z-index: 1;
            opacity: 0.8;
        }

        .article-category {
            position: absolute;
            top: 16px;
            left: 16px;
            padding: 6px 12px;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 20px;
            font-size: 0.75rem;
            color: #a5b4fc;
            font-weight: 600;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .article-content {
            padding: 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .article-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .article-date::before {
            content: '📅';
            margin-right: 4px;
        }

        .read-time::before {
            content: '⏱️';
            margin-right: 4px;
        }

        .article-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
            line-height: 1.4;
            transition: color 0.3s;
        }

        .article-card:hover .article-title {
            color: #a5b4fc;
        }

        .article-excerpt {
            color: var(--text-secondary);
            font-size: 0.875rem;
            line-height: 1.6;
            margin-bottom: 16px;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .article-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .article-stats {
            display: flex;
            gap: 16px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .stat-item.liked {
            color: #f9a8d4;
        }

        .read-more {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--primary-color);
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            transition: gap 0.3s;
        }

        .read-more:hover {
            gap: 10px;
        }

        /* 文章详情弹窗 */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 20px;
        }

        .modal-content {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .modal-close:hover {
            background: rgba(239, 68, 68, 0.3);
            transform: rotate(90deg);
        }

        .delete-btn {
            position: absolute;
            top: 20px;
            right: 70px;
            padding: 8px 16px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            color: #fca5a5;
            font-size: 0.875rem;
            cursor: pointer;
            transition: var(--transition);
            display: none;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .modal-content.owner-view .delete-btn {
            display: block;
        }

        .article-full {
            padding: 40px;
        }

        .article-header {
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .article-full-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .article-full-meta {
            display: flex;
            gap: 24px;
            color: var(--text-secondary);
            font-size: 0.875rem;
            flex-wrap: wrap;
        }

        .article-body {
            font-size: 1.125rem;
            line-height: 1.8;
            color: var(--text-secondary);
            margin-bottom: 32px;
            white-space: pre-wrap;
        }

        .article-body h2 {
            color: var(--text-primary);
            margin: 24px 0 16px;
            font-size: 1.5rem;
        }

        .article-body p {
            margin-bottom: 16px;
        }

        .article-actions {
            display: flex;
            gap: 16px;
            padding: 24px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 32px;
        }

        .action-btn-large {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-secondary);
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .action-btn-large:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.3);
            color: var(--text-primary);
            transform: scale(1.05);
        }

        .action-btn-large.liked {
            background: rgba(236, 72, 153, 0.2);
            border-color: rgba(236, 72, 153, 0.5);
            color: #f9a8d4;
        }

        /* 评论区 */
        .comments-section {
            margin-top: 32px;
        }

        .comments-header {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .comment-form {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .comment-input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .comment-input {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.875rem;
            outline: none;
        }

        .comment-input:focus {
            border-color: var(--primary-color);
        }

        .comment-textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.875rem;
            min-height: 80px;
            resize: vertical;
            margin-bottom: 12px;
            outline: none;
            font-family: inherit;
        }

        .comment-textarea:focus {
            border-color: var(--primary-color);
        }

        .comment-submit {

            ).join('');

        // 编辑器工具栏
        function insertText(before, after) {
            const textarea = document.getElementById('articleContent');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            const selected = text.substring(start, end);
            
            textarea.value = text.substring(0, start) + before + selected + after + text.substring(end);
            textarea.focus();
            textarea.setSelectionRange(start + before.length, end + before.length);
        }

                excerpt,
                date: new Date().toISOString(),
                readTime: parseInt(readTime),
                views: 0,
                likes: 0,
                isLiked: false,
                comments: []
            };
            
            articles.unshift(newArticle);
            saveArticles();
            
            document.getElementById('articleForm').reset();
            updateSubCategories();
            
            showToast('🎉 文章发布成功！', 'owner');
            renderArticles();
        }

        // ==================== 分类筛选 ====================
        
        function filterByMain(mainCat) {
            currentMainFilter = mainCat;
            currentSubFilter = 'all';
            
            // 更新按钮状态
            document.querySelectorAll('.main-categories .category-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.closest('.category-btn').classList.add('active');
            
            // 更新子分类显示
            const subContainer = document.getElementById('subCategories');
            if (mainCat === 'all') {
                subContainer.innerHTML = '';
            } else {
                const subCats = categories[mainCat].subCategories;
                subContainer.innerHTML = `
                    <button class="sub-category-btn active" onclick="filterBySub('all')">全部</button>
                    ${Object.entries(subCats).map(([key, name]) => 
                        `<button class="sub-category-btn" onclick="filterBySub('${key}')">${name}</button>`
                    ).join('')}
                `;
            }
            
            renderArticles();
        }

        function filterBySub(subCat) {
            currentSubFilter = subCat;
            
            // 更新按钮状态
            document.querySelectorAll('.sub-category-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderArticles();
        }

        // ==================== 渲染文章 ====================
        
        function renderArticles() {
            const grid = document.getElementById('articlesGrid');
            
            let displayArticles = articles;
            
            // 主分类筛选
            if (currentMainFilter !== 'all') {
                displayArticles = displayArticles.filter(a => a.mainCategory === currentMainFilter);
            }
            
            // 子分类筛选
            if (currentSubFilter !== 'all') {
                displayArticles = displayArticles.filter(a => a.subCategory === currentSubFilter);
            }
            
            if (displayArticles.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1; text-align: center; padding: 60px; color: var(--text-secondary);">
                        <div style="font-size: 4rem; margin-bottom: 16px;">📭</div>
                        <p>该分类下暂无文章</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = displayArticles.map(article => {
                const cat = categories[article.mainCategory];
                const subCatName = cat.subCategories[article.subCategory];
                const diff = difficultyMap[article.difficulty];
                
                return `
                    <article class="article-card" onclick="openArticle(${article.id})">
                        <div class="article-cover" style="background: linear-gradient(135deg, ${cat.color}, rgba(168, 85, 247, 0.3));">
                            <span class="cover-icon">${cat.icon}</span>
                            <span class="article-category">${subCatName}</span>
                        </div>
                        <div class="article-content">
                            <div class="article-meta">
                                <span class="article-date">${formatDate(article.date)}</span>
                                <span class="read-time">${article.readTime}分钟</span>
                                <span>${diff.icon} ${diff.name}</span>
                            </div>
                            <h2 class="article-title">${escapeHtml(article.title)}</h2>
                            <p class="article-excerpt">${escapeHtml(article.excerpt)}</p>
                            <div style="display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;">
                                ${article.tags.map(tag => `<span style="padding: 4px 10px; background: rgba(99, 102, 241, 0.15); border-radius: 12px; font-size: 0.75rem; color: #a5b4fc;">${escapeHtml(tag)}</span>`).join('')}
                            </div>
                            <div class="article-footer">
                                <div class="article-stats">
                                    <span class="stat-item ${article.isLiked ? 'liked' : ''}">
                                        <span>${article.isLiked ? '❤️' : '🤍'}</span>
                                        <span>${article.likes}</span>
                                    </span>
                                    <span class="stat-item">
                                        <span>💬</span>
                                        <span>${article.comments.length}</span>
                                    </span>
                                    <span class="stat-item">
                                        <span>👁️</span>
                                        <span>${article.views}</span>
                                    </span>
                                </div>
                                <span class="read-more">阅读全文 →</span>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        // ==================== 文章详情 ====================
        
        function openArticle(id) {
            currentArticleId = id;
            const article = articles.find(a => a.id === id);
            if (!article) return;
            
            article.views++;
            saveArticles();
            
            const cat = categories[article.mainCategory];
            const subCatName = cat.subCategories[article.subCategory];
            const diff = difficultyMap[article.difficulty];
            
            document.getElementById('modalTitle').textContent = article.title;
            document.getElementById('modalCategory').textContent = `${cat.icon} ${cat.name} · ${subCatName}`;
            document.getElementById('modalDate').textContent = '📅 ' + formatDate(article.date);
            document.getElementById('modalReadTime').textContent = '⏱️ ' + article.readTime + '分钟';
            document.getElementById('modalDifficulty').textContent = `${diff.icon} ${diff.name}`;
            document.getElementById('modalViews').textContent = '👁️ ' + article.views + '次浏览';
            
            // 标签
            document.getElementById('modalTags').innerHTML = article.tags.map(tag => 
                `<span style="padding: 6px 14px; background: rgba(99, 102, 241, 0.2); border-radius: 20px; font-size: 0.875rem; color: #a5b4fc;">${escapeHtml(tag)}</span>`
            ).join('');
            
            // 内容渲染
            let bodyHtml = escapeHtml(article.content)
                .replace(/## (.*)/g, '<h2>$1</h2>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`(.*?)`/g, '<code style="background:rgba(99,102,241,0.2);padding:2px 6px;border-radius:4px;">$1</code>')
                .replace(/```([\s\S]*?)```/g, '<pre style="background:rgba(0,0,0,0.3);padding:16px;border-radius:8px;overflow-x:auto;"><code>$1</code></pre>')
                .replace(/- (.*)/g, '<li style="margin-left:20px;">$1</li>')
                .replace(/> (.*)/g, '<blockquote style="border-left:4px solid var(--primary-color);padding-left:16px;margin:16px 0;color:var(--text-secondary);">$1</blockquote>')
                .replace(/!\[(.*?)\]\((.*?)\)/g, '<img src="$2" alt="$1" style="max-width:100%;border-radius:8px;margin:16px 0;">')
                .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" style="color:var(--primary-color);text-decoration:underline;">$1</a>')
                .replace(/\n/g, '<br>');
            
            document.getElementById('modalBody').innerHTML = bodyHtml;
            
            updateLikeButton(article);
            document.getElementById('modalContent').classList.toggle('owner-view', isOwner);
            renderComments(article);
            
            document.getElementById('articleModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('articleModal').classList.remove('active');
            document.body.style.overflow = '';
            currentArticleId = null;
        }

        function toggleArticleLike() {
            const article = articles.find(a => a.id === currentArticleId);
            if (!article) return;
            
            if (article.isLiked) {
                article.likes--;
                article.isLiked = false;
            } else {
                article.likes++;
                article.isLiked = true;
            }
            
            saveArticles();
            updateLikeButton(article);
            renderArticles();
        }

        function updateLikeButton(article) {
            const btn = document.getElementById('likeBtn');
            const icon = document.getElementById('likeIcon');
            const count = document.getElementById('likeCount');
            
            btn.classList.toggle('liked', article.isLiked);
            icon.textContent = article.isLiked ? '❤️' : '🤍';
            count.textContent = article.likes;
        }

        function deleteArticle() {
            if (!confirm('确定要删除这篇文章吗？')) return;
            
            articles = articles.filter(a => a.id !== currentArticleId);
            saveArticles();
            closeModal();
            renderArticles();
            showToast('文章已删除', 'success');
        }

        function shareArticle() {
            const article = articles.find(a => a.id === currentArticleId);
            const url = window.location.href + '#article=' + article.id;
            
            if (navigator.share) {
                navigator.share({ title: article.title, url });
            } else {
                navigator.clipboard.writeText(url);
                showToast('链接已复制到剪贴板', 'success');
            }
        }

        // ==================== 评论 ====================
        
        function postComment() {
            const name = document.getElementById('commentName').value.trim() || '匿名访客';
            const content = document.getElementById('commentContent').value.trim();
            
            if (!content) {
                showToast('请输入评论内容', 'error');
                return;
            }
            
            const article = articles.find(a => a.id === currentArticleId);
            article.comments.push({
                name: isOwner ? OWNER_NAME : name,
                content,
                time: new Date().toISOString(),
                isOwner: isOwner
            });
            
            saveArticles();
            renderComments(article);
            
            if (!isOwner) {
                document.getElementById('commentName').value = '';
            }
            document.getElementById('commentContent').value = '';
            
            showToast(isOwner ? '博主回复成功！' : '评论发表成功！', isOwner ? 'owner' : 'success');
        }

        function renderComments(article) {
            const list = document.getElementById('commentsList');
            const count = document.getElementById('commentCount');
            
            count.textContent = article.comments.length;
            
            if (article.comments.length === 0) {
                list.innerHTML = '<div class="empty-comments">暂无评论，快来抢沙发吧！</div>';
                return;
            }
            
            list.innerHTML = article.comments.map(comment => `
                <div class="comment-item">
                    <div class="comment-author">
                        <div class="comment-avatar ${comment.isOwner ? 'owner' : ''}">${comment.name.charAt(0)}</div>
                        <span class="comment-name ${comment.isOwner ? 'owner' : ''}">
                            ${escapeHtml(comment.name)}
                            ${comment.isOwner ? '<span class="owner-tag">博主</span>' : ''}
                        </span>
                        <span class="comment-time">${formatDate(comment.time)}</span>
                    </div>
                    <div class="comment-content">${escapeHtml(comment.content)}</div>
                </div>
            `).join('');
        }

        // ==================== 工具函数 ====================
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
            if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
            
            return date.toLocaleDateString('zh-CN');
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const msg = document.getElementById('toastMessage');
            
            toast.className = `toast ${type}`;
            icon.textContent = type === 'owner' ? '👑' : (type === 'error' ? '❌' : '✅');
            msg.textContent = message;
            
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // 点击弹窗外部关闭
        document.getElementById('articleModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });
    </script>
</body>

</html>
