<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章 | 子秋博客</title>
    <link rel="shortcut icon" href="./images/ZiQiu.jpg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* 基础变量 */
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --secondary-color: #ec4899;
            --accent-color: #f59e0b;
            --owner-color: #fbbf24;
            --owner-glow: rgba(251, 191, 36, 0.4);
            --bg-dark: #0f172a;
            --bg-light: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* 动态背景 */
        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .gradient-sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 20s infinite ease-in-out;
        }

        .sphere-1 {
            width: 600px;
            height: 600px;
            background: linear-gradient(45deg, #6366f1, #a855f7);
            top: -200px;
            right: -100px;
        }

        .sphere-2 {
            width: 400px;
            height: 400px;
            background: linear-gradient(45deg, #ec4899, #f43f5e);
            bottom: -100px;
            left: -100px;
            animation-delay: -5s;
        }

        .sphere-3 {
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #f59e0b, #f97316);
            top: 50%;
            left: 50%;
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* 导航栏 */
        .navbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: var(--glass-shadow);
            transition: var(--transition);
        }

        .navbar.scrolled {
            top: 10px;
            background: rgba(15, 23, 42, 0.9);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.3s;
        }

        .brand-logo:hover {
            transform: rotate(360deg) scale(1.1);
        }

        .brand-text {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 8px;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 500;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .nav-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(236, 72, 153, 0.2));
            opacity: 0;
            transition: opacity 0.3s;
            z-index: -1;
        }

        .nav-link:hover::before,
        .nav-link.active::before {
            opacity: 1;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        /* 汉堡菜单 */
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
        }

        .bar {
            width: 25px;
            height: 3px;
            background: var(--text-primary);
            border-radius: 3px;
            transition: var(--transition);
        }

        /* 主体区域 */
        .blog-section {
            min-height: 100vh;
            padding: 120px 5% 60px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 页面头部 */
        .blog-header {
            text-align: center;
            margin-bottom: 48px;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .blog-badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.4);
            border-radius: 20px;
            font-size: 0.875rem;
            color: #a5b4fc;
            margin-bottom: 16px;
        }

        .blog-title {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #f093fb 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient 3s linear infinite;
        }

        @keyframes gradient {
            to { background-position: 200% center; }
        }

        .blog-subtitle {
            color: var(--text-secondary);
            font-size: 1.125rem;
        }

        /* 博主控制面板 */
        .owner-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px;
            margin-bottom: 48px;
            animation: fadeInUp 0.8s ease-out 0.1s both;
            display: none;
        }

        .owner-panel.active {
            display: block;
            border-color: var(--owner-color);
            box-shadow: 0 0 30px var(--owner-glow);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .panel-title {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .panel-title::before {
            content: '👑';
            font-size: 1.5rem;
        }

        .logout-btn {
            padding: 8px 16px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            color: #fca5a5;
            font-size: 0.875rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            transform: scale(1.05);
        }

        /* 编辑器 */
        .editor-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .editor-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-input,
        .form-select,
        .form-textarea {
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: var(--transition);
            outline: none;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: var(--owner-color);
            box-shadow: 0 0 0 3px var(--owner-glow);
            background: rgba(255, 255, 255, 0.08);
        }

        .form-textarea {
            min-height: 300px;
            resize: vertical;
            line-height: 1.8;
        }

        .editor-toolbar {
            display: flex;
            gap: 8px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            flex-wrap: wrap;
        }

        .tool-btn {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 0.875rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .tool-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.3);
            color: var(--text-primary);
        }

        .publish-btn {
            align-self: flex-start;
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--owner-color), #f59e0b);
            border: none;
            border-radius: 12px;
            color: #0f172a;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px var(--owner-glow);
        }

        .publish-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--owner-glow);
        }

        /* 登录提示 */
        .login-prompt {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            margin-bottom: 48px;
            animation: fadeInUp 0.8s ease-out 0.1s both;
        }

        .login-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .login-text {
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .login-btn {
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6);
        }

        /* 分类标签 */
        .category-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .tab-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }

        .tab-btn:hover,
        .tab-btn.active {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.5);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        /* 文章网格 */
        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }

        /* 文章卡片 */
        .article-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            overflow: hidden;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .article-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .article-cover {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(236, 72, 153, 0.3));
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .cover-icon {
            font-size: 3rem;
            z-index: 1;
            opacity: 0.8;
        }

        .article-category {
            position: absolute;
            top: 16px;
            left: 16px;
            padding: 6px 12px;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 20px;
            font-size: 0.75rem;
            color: #a5b4fc;
            font-weight: 600;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .article-content {
            padding: 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .article-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .article-date::before {
            content: '📅';
            margin-right: 4px;
        }

        .read-time::before {
            content: '⏱️';
            margin-right: 4px;
        }

        .article-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
            line-height: 1.4;
            transition: color 0.3s;
        }

        .article-card:hover .article-title {
            color: #a5b4fc;
        }

        .article-excerpt {
            color: var(--text-secondary);
            font-size: 0.875rem;
            line-height: 1.6;
            margin-bottom: 16px;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .article-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .article-stats {
            display: flex;
            gap: 16px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .stat-item.liked {
            color: #f9a8d4;
        }

        .read-more {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--primary-color);
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            transition: gap 0.3s;
        }

        .read-more:hover {
            gap: 10px;
        }

        /* 文章详情弹窗 */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 20px;
        }

        .modal-content {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .modal-close:hover {
            background: rgba(239, 68, 68, 0.3);
            transform: rotate(90deg);
        }

        .article-full {
            padding: 40px;
        }

        .article-header {
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .article-full-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .article-full-meta {
            display: flex;
            gap: 24px;
            color: var(--text-secondary);
            font-size: 0.875rem;
            flex-wrap: wrap;
        }

        .article-body {
            font-size: 1.125rem;
            line-height: 1.8;
            color: var(--text-secondary);
            margin-bottom: 32px;
            white-space: pre-wrap;
        }

        .article-body h2 {
            color: var(--text-primary);
            margin: 24px 0 16px;
            font-size: 1.5rem;
        }

        .article-body p {
            margin-bottom: 16px;
        }

        .article-actions {
            display: flex;
            gap: 16px;
            padding: 24px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 32px;
        }

        .action-btn-large {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-secondary);
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .action-btn-large:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.3);
            color: var(--text-primary);
            transform: scale(1.05);
        }

        .action-btn-large.liked {
            background: rgba(236, 72, 153, 0.2);
            border-color: rgba(236, 72, 153, 0.5);
            color: #f9a8d4;
        }

        /* 评论区 */
        .comments-section {
            margin-top: 32px;
        }

        .comments-header {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .comment-form {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .comment-input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .comment-input {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.875rem;
            outline: none;
        }

        .comment-input:focus {
            border-color: var(--primary-color);
        }

        .comment-textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.875rem;
            min-height: 80px;
            resize: vertical;
            margin-bottom: 12px;
            outline: none;
            font-family: inherit;
        }

        .comment-textarea:focus {
            border-color: var(--primary-color);
        }

        .comment-submit {
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .comment-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .comment-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .comment-author {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .comment-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .comment-avatar.owner {
            background: linear-gradient(135deg, var(--owner-color), #f59e0b);
        }

        .comment-name {
            font-weight: 600;
            font-size: 0.875rem;
        }

        .comment-name.owner {
            background: linear-gradient(135deg, var(--owner-color), #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .owner-tag {
            padding: 2px 8px;
            background: linear-gradient(135deg, var(--owner-color), #f59e0b);
            border-radius: 4px;
            font-size: 0.625rem;
            color: #0f172a;
            font-weight: 700;
            margin-left: 8px;
        }

        .comment-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-left: auto;
        }

        .comment-content {
            color: var(--text-secondary);
            font-size: 0.875rem;
            line-height: 1.6;
            padding-left: 44px;
        }

        .empty-comments {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        /* 删除按钮（仅博主可见） */
        .delete-btn {
            position: absolute;
            top: 20px;
            right: 70px;
            padding: 8px 16px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            color: #fca5a5;
            font-size: 0.875rem;
            cursor: pointer;
            transition: var(--transition);
            display: none;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .modal-content.owner-view .delete-btn {
            display: block;
        }

        /* 响应式 */
        @media (max-width: 968px) {
            .blog-title { font-size: 2.5rem; }
            .articles-grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
            .editor-row { grid-template-columns: 1fr; }
            .comment-input-row { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            .hamburger { display: flex; }
            .nav-menu {
                position: fixed;
                left: -100%;
                top: 80px;
                flex-direction: column;
                background: rgba(15, 23, 42, 0.98);
                width: 90%;
                margin: 0 5%;
                text-align: center;
                transition: 0.3s;
                border-radius: 16px;
                padding: 20px;
                box-shadow: var(--glass-shadow);
                border: 1px solid var(--glass-border);
            }
            .nav-menu.active { left: 0; }
            .nav-link { padding: 16px; display: block; }
            .navbar { width: 95%; top: 10px; }
            .articles-grid { grid-template-columns: 1fr; }
            .article-full { padding: 24px; }
            .article-full-title { font-size: 1.5rem; }
        }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: linear-gradient(var(--primary-color), var(--secondary-color)); border-radius: 5px; }

        /* 提示消息 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 16px 24px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-primary);
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: all 0.3s;
            z-index: 3000;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success { border-color: rgba(34, 197, 94, 0.5); background: rgba(34, 197, 94, 0.1); }
        .toast.error { border-color: rgba(239, 68, 68, 0.5); background: rgba(239, 68, 68, 0.1); }
        .toast.owner { border-color: var(--owner-color); background: rgba(251, 191, 36, 0.15); color: var(--owner-color); }
    </style>
</head>
<body>
    <!-- 动态背景 -->
    <div class="gradient-bg">
        <div class="gradient-sphere sphere-1"></div>
        <div class="gradient-sphere sphere-2"></div>
        <div class="gradient-sphere sphere-3"></div>
    </div>

    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-brand">
            <img src="images/ZiQiu.jpg" alt="子秋" class="brand-logo">
            <span class="brand-text">子秋博客</span>
        </div>
        <ul class="nav-menu">
            <li><a href="index.html" class="nav-link">首页</a></li>
            <li><a href="jieshao.html" class="nav-link">介绍</a></li>
            <li><a href="text.html" class="nav-link active">文章</a></li>
            <li><a href="vlog.html" class="nav-link">Vlog</a></li>
            <li><a href="liuyan.html" class="nav-link">留言</a></li>
        </ul>
        <div class="hamburger">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
    </nav>

    <!-- 主体区域 -->
    <main class="blog-section">
        <!-- 页面头部 -->
        <header class="blog-header">
            <div class="blog-badge">📝 技术博客</div>
            <h1 class="blog-title">
                <span class="gradient-text">文章</span>列表
            </h1>
            <p class="blog-subtitle">
                分享学习心得、技术干货与成长记录
            </p>
        </header>

        <!-- 博主登录提示 -->
        <div class="login-prompt" id="loginPrompt">
            <div class="login-icon">👑</div>
            <p class="login-text">博主身份验证后可发布文章</p>
            <button class="login-btn" onclick="ownerLogin()">博主登录</button>
        </div>

        <!-- 博主编辑面板（默认隐藏） -->
        <div class="owner-panel" id="ownerPanel">
            <div class="panel-header">
                <h2 class="panel-title">发布新文章</h2>
                <button class="logout-btn" onclick="ownerLogout()">退出登录</button>
            </div>
            <form class="editor-form" id="articleForm" onsubmit="publishArticle(event)">
                <div class="editor-row">
                    <div class="form-group">
                        <label class="form-label">文章标题</label>
                        <input type="text" class="form-input" id="articleTitle" placeholder="输入文章标题..." required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">分类</label>
                        <select class="form-select" id="articleCategory">
                            <option value="tech">前端技术</option>
                            <option value="programming">编程学习</option>
                            <option value="project">项目实战</option>
                            <option value="life">生活随笔</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">阅读时间</label>
                        <select class="form-select" id="readTime">
                            <option value="3">3分钟</option>
                            <option value="5">5分钟</option>
                            <option value="8">8分钟</option>
                            <option value="10">10分钟</option>
                            <option value="15">15分钟</option>
                        </select>
                    </div>
                </div>
                <div class="editor-toolbar">
                    <button type="button" class="tool-btn" onclick="insertText('## ', '')">标题</button>
                    <button type="button" class="tool-btn" onclick="insertText('**', '**')">粗体</button>
                    <button type="button" class="tool-btn" onclick="insertText('*', '*')">斜体</button>
                    <button type="button" class="tool-btn" onclick="insertText('```\n', '\n```')">代码块</button>
                    <button type="button" class="tool-btn" onclick="insertText('- ', '')">列表</button>
                    <button type="button" class="tool-btn" onclick="insertText('> ', '')">引用</button>
                </div>
                <div class="form-group">
                    <textarea class="form-textarea" id="articleContent" placeholder="在此输入文章内容...
支持 Markdown 格式：
## 二级标题
**粗体文字**
`代码`
- 列表项
> 引用" required></textarea>
                </div>
                <button type="submit" class="publish-btn">
                    <span>🚀</span>
                    <span>发布文章</span>
                </button>
            </form>
        </div>

        <!-- 分类标签 -->
        <div class="category-tabs">
            <button class="tab-btn active" onclick="filterArticles('all')">全部文章</button>
            <button class="tab-btn" onclick="filterArticles('tech')">前端技术</button>
            <button class="tab-btn" onclick="filterArticles('programming')">编程学习</button>
            <button class="tab-btn" onclick="filterArticles('project')">项目实战</button>
            <button class="tab-btn" onclick="filterArticles('life')">生活随笔</button>
        </div>

        <!-- 文章网格 -->
        <div class="articles-grid" id="articlesGrid">
            <!-- 文章卡片动态生成 -->
        </div>
    </main>

    <!-- 文章详情弹窗 -->
    <div class="modal" id="articleModal">
        <div class="modal-content" id="modalContent">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <button class="delete-btn" id="deleteBtn" onclick="deleteArticle()">🗑️ 删除文章</button>
            <article class="article-full">
                <header class="article-header">
                    <h1 class="article-full-title" id="modalTitle"></h1>
                    <div class="article-full-meta">
                        <span id="modalCategory"></span>
                        <span id="modalDate"></span>
                        <span id="modalReadTime"></span>
                        <span id="modalViews"></span>
                    </div>
                </header>
                <div class="article-body" id="modalBody"></div>
                <div class="article-actions">
                    <button class="action-btn-large" id="likeBtn" onclick="toggleArticleLike()">
                        <span id="likeIcon">🤍</span>
                        <span id="likeCount">0</span>
                    </button>
                    <button class="action-btn-large" onclick="shareArticle()">
                        <span>🔗</span>
                        <span>分享</span>
                    </button>
                </div>
                
                <!-- 评论区 -->
                <div class="comments-section">
                    <h3 class="comments-header">💬 评论 (<span id="commentCount">0</span>)</h3>
                    <div class="comment-form">
                        <div class="comment-input-row">
                            <input type="text" class="comment-input" id="commentName" placeholder="你的昵称" maxlength="20">
                            <input type="email" class="comment-input" id="commentEmail" placeholder="邮箱（选填）">
                        </div>
                        <textarea class="comment-textarea" id="commentContent" placeholder="发表你的看法..." maxlength="300"></textarea>
                        <button class="comment-submit" onclick="postComment()">发表评论</button>
                    </div>
                    <div class="comments-list" id="commentsList">
                        <!-- 评论动态生成 -->
                    </div>
                </div>
            </article>
        </div>
    </div>

    <!-- 提示消息 -->
    <div class="toast" id="toast">
        <span id="toastIcon">✅</span>
        <span id="toastMessage">操作成功</span>
    </div>

    <script>
        // 配置
        const OWNER_KEY = 'qn120922';
        const OWNER_NAME = '子秋';
        let isOwner = false;
        let currentArticleId = null;

        // 分类映射
        const categoryMap = {
            tech: { name: '前端技术', icon: '⚡', color: 'rgba(99, 102, 241, 0.3)' },
            programming: { name: '编程学习', icon: '🐍', color: 'rgba(236, 72, 153, 0.3)' },
            project: { name: '项目实战', icon: '🚀', color: 'rgba(245, 158, 11, 0.3)' },
            life: { name: '生活随笔', icon: '📝', color: 'rgba(34, 197, 94, 0.3)' }
        };

        // 初始化数据
        let articles = JSON.parse(localStorage.getItem('blogArticles')) || [];
        
        if (articles.length === 0) {
            articles = [
                {
                    id: 1,
                    title: 'CSS 玻璃拟态效果完全指南',
                    category: 'tech',
                    content: '## 什么是玻璃拟态\n\n玻璃拟态（Glassmorphism）是一种现代 UI 设计趋势，主要特点包括：\n\n- **半透明背景**\n- **背景模糊效果**\n- **微妙的边框**\n- **层次感的阴影**\n\n## 核心代码\n\n```css\n.glass {\n    background: rgba(255, 255, 255, 0.1);\n    backdrop-filter: blur(10px);\n    border: 1px solid rgba(255, 255, 255, 0.2);\n}\n```\n\n## 使用场景\n\n玻璃拟态特别适合用于：\n- 导航栏\n- 卡片背景\n- 弹窗遮罩\n- 浮动元素',
                    excerpt: '深入探讨如何使用 backdrop-filter 和半透明背景创造现代化的 Glassmorphism 设计效果...',
                    date: new Date(Date.now() - 86400000 * 2).toISOString(),
                    readTime: 5,
                    views: 128,
                    likes: 45,
                    isLiked: false,
                    comments: [
                        { name: '小明', content: '写得太好了，正好需要这个！', time: new Date(Date.now() - 3600000).toISOString(), isOwner: false },
                        { name: OWNER_NAME, content: '谢谢支持，有问题随时问我~', time: new Date(Date.now() - 1800000).toISOString(), isOwner: true }
                    ]
                },
                {
                    id: 2,
                    title: 'Python 入门：从零开始的学习之路',
                    category: 'programming',
                    content: '作为一名六年级学生，我是如何开始学习 Python 编程的？\n\n## 我的学习路径\n\n1. **基础语法** - 变量、数据类型、控制流\n2. **函数与模块** - 代码复用和组织\n3. **面向对象** - 类和对象的概念\n4. **实战项目** - 用所学知识做小游戏\n\n## 推荐资源\n\n- Python 官方文档\n- Codecademy 互动教程\n- 廖雪峰 Python 教程',
                    excerpt: '分享我的 Python 学习经历，从入门到实战的完整路径...',
                    date: new Date(Date.now() - 86400000 * 5).toISOString(),
                    readTime: 8,
                    views: 256,
                    likes: 72,
                    isLiked: false,
                    comments: []
                },
                {
                    id: 3,
                    title: '如何搭建一个现代化的个人博客',
                    category: 'project',
                    content: '记录子秋博客 3.0 的开发全过程。\n\n## 技术选型\n\n- **前端**: 纯 HTML/CSS/JS，无框架\n- **设计**: Glassmorphism 风格\n- **部署**: GitHub Pages\n\n## 核心功能\n\n1. 响应式布局\n2. 深色主题\n3. 动画效果\n4. 本地数据存储\n\n## 心得体会\n\n自己动手做项目是最好的学习方式！',
                    excerpt: '从设计思路到技术选型，完整复盘博客项目的开发过程...',
                    date: new Date(Date.now() - 86400000 * 7).toISOString(),
                    readTime: 10,
                    views: 512,
                    likes: 128,
                    isLiked: false,
                    comments: []
                }
            ];
            saveArticles();
        }

        function saveArticles() {
            localStorage.setItem('blogArticles', JSON.stringify(articles));
        }

        // 导航栏滚动
        window.addEventListener('scroll', () => {
            const navbar = document.querySelector('.navbar');
            navbar.classList.toggle('scrolled', window.scrollY > 50);
        });

        // 移动端菜单
        document.querySelector('.hamburger').addEventListener('click', () => {
            document.querySelector('.nav-menu').classList.toggle('active');
        });

        // 博主登录
        function ownerLogin() {
            const key = prompt('请输入博主密钥：');
            if (key === OWNER_KEY) {
                isOwner = true;
                document.getElementById('loginPrompt').style.display = 'none';
                document.getElementById('ownerPanel').classList.add('active');
                showToast('👑 欢迎回来，博主！', 'owner');
                renderArticles();
            } else {
                showToast('密钥错误！', 'error');
            }
        }

        // 博主退出
        function ownerLogout() {
            isOwner = false;
            document.getElementById('loginPrompt').style.display = 'block';
            document.getElementById('ownerPanel').classList.remove('active');
            document.getElementById('articleForm').reset();
            showToast('已退出博主模式', 'success');
            renderArticles();
        }

        // 发布文章
        function publishArticle(e) {
            e.preventDefault();
            
            const title = document.getElementById('articleTitle').value;
            const category = document.getElementById('articleCategory').value;
            const readTime = document.getElementById('readTime').value;
            const content = document.getElementById('articleContent').value;
            
            // 生成摘要（前100字）
            const excerpt = content.replace(/[#*`>\-]/g, '').substring(0, 100) + '...';
            
            const newArticle = {
                id: Date.now(),
                title,
                category,
                content,
                excerpt,
                date: new Date().toISOString(),
                readTime: parseInt(readTime),
                views: 0,
                likes: 0,
                isLiked: false,
                comments: []
            };
            
            articles.unshift(newArticle);
            saveArticles();
            
            document.getElementById('articleForm').reset();
            showToast('🎉 文章发布成功！', 'owner');
            renderArticles();
        }

        // 编辑器工具栏
        function insertText(before, after) {
            const textarea = document.getElementById('articleContent');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            const selected = text.substring(start, end);
            
            textarea.value = text.substring(0, start) + before + selected + after + text.substring(end);
            textarea.focus();
            textarea.setSelectionRange(start + before.length, end + before.length);
        }

        // 渲染文章列表
        function renderArticles(filter = 'all') {
            const grid = document.getElementById('articlesGrid');
            let displayArticles = filter === 'all' ? articles : articles.filter(a => a.category === filter);
            
            grid.innerHTML = displayArticles.map(article => {
                const cat = categoryMap[article.category];
                const isOwnerArticle = article.comments.some(c => c.isOwner);
                
                return `
                    <article class="article-card" onclick="openArticle(${article.id})">
                        <div class="article-cover" style="background: linear-gradient(135deg, ${cat.color}, rgba(168, 85, 247, 0.3));">
                            <span class="cover-icon">${cat.icon}</span>
                            <span class="article-category">${cat.name}</span>
                        </div>
                        <div class="article-content">
                            <div class="article-meta">
                                <span class="article-date">${formatDate(article.date)}</span>
                                <span class="read-time">${article.readTime}分钟阅读</span>
                            </div>
                            <h2 class="article-title">${escapeHtml(article.title)}</h2>
                            <p class="article-excerpt">${escapeHtml(article.excerpt)}</p>
                            <div class="article-footer">
                                <div class="article-stats">
                                    <span class="stat-item ${article.isLiked ? 'liked' : ''}">
                                        <span>${article.isLiked ? '❤️' : '🤍'}</span>
                                        <span>${article.likes}</span>
                                    </span>
                                    <span class="stat-item">
                                        <span>💬</span>
                                        <span>${article.comments.length}</span>
                                    </span>
                                    <span class="stat-item">
                                        <span>👁️</span>
                                        <span>${article.views}</span>
                                    </span>
                                </div>
                                <span class="read-more">阅读全文 →</span>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        // 筛选文章
        function filterArticles(category) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderArticles(category);
        }

        // 打开文章详情
        function openArticle(id) {
            currentArticleId = id;
            const article = articles.find(a => a.id === id);
            if (!article) return;
            
            // 增加浏览量
            article.views++;
            saveArticles();
            
            // 填充内容
            document.getElementById('modalTitle').textContent = article.title;
            document.getElementById('modalCategory').textContent = categoryMap[article.category].icon + ' ' + categoryMap[article.category].name;
            document.getElementById('modalDate').textContent = '📅 ' + formatDate(article.date);
            document.getElementById('modalReadTime').textContent = '⏱️ ' + article.readTime + '分钟阅读';
            document.getElementById('modalViews').textContent = '👁️ ' + article.views + '次浏览';
            
            // 渲染 Markdown 内容（简单处理）
            let bodyHtml = escapeHtml(article.content)
                .replace(/## (.*)/g, '<h2>$1</h2>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`(.*?)`/g, '<code style="background:rgba(99,102,241,0.2);padding:2px 6px;border-radius:4px;">$1</code>')
                .replace(/```([\s\S]*?)```/g, '<pre style="background:rgba(0,0,0,0.3);padding:16px;border-radius:8px;overflow-x:auto;"><code>$1</code></pre>')
                .replace(/- (.*)/g, '<li style="margin-left:20px;">$1</li>')
                .replace(/> (.*)/g, '<blockquote style="border-left:4px solid var(--primary-color);padding-left:16px;margin:16px 0;color:var(--text-secondary);">$1</blockquote>')
                .replace(/\n/g, '<p style="margin-bottom:16px;">') + '</p>';
            
            document.getElementById('modalBody').innerHTML = bodyHtml;
            
            // 更新点赞按钮
            updateLikeButton(article);
            
            // 显示/隐藏删除按钮
            document.getElementById('modalContent').classList.toggle('owner-view', isOwner);
            
            // 渲染评论
            renderComments(article);
            
            // 显示弹窗
            document.getElementById('articleModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // 关闭弹窗
        function closeModal() {
            document.getElementById('articleModal').classList.remove('active');
            document.body.style.overflow = '';
            currentArticleId = null;
        }

        // 点赞文章
        function toggleArticleLike() {
            const article = articles.find(a => a.id === currentArticleId);
            if (!article) return;
            
            if (article.isLiked) {
                article.likes--;
                article.isLiked = false;
            } else {
                article.likes++;
                article.isLiked = true;
            }
            
            saveArticles();
            updateLikeButton(article);
            renderArticles();
        }

        function updateLikeButton(article) {
            const btn = document.getElementById('likeBtn');
            const icon = document.getElementById('likeIcon');
            const count = document.getElementById('likeCount');
            
            btn.classList.toggle('liked', article.isLiked);
            icon.textContent = article.isLiked ? '❤️' : '🤍';
            count.textContent = article.likes;
        }

        // 删除文章
        function deleteArticle() {
            if (!confirm('确定要删除这篇文章吗？')) return;
            
            articles = articles.filter(a => a.id !== currentArticleId);
            saveArticles();
            closeModal();
            renderArticles();
            showToast('文章已删除', 'success');
        }

        // 分享文章
        function shareArticle() {
            const article = articles.find(a => a.id === currentArticleId);
            const url = window.location.href + '#article=' + article.id;
            
            if (navigator.share) {
                navigator.share({ title: article.title, url });
            } else {
                navigator.clipboard.writeText(url);
                showToast('链接已复制到剪贴板', 'success');
            }
        }

        // 发表评论
        function postComment() {
            const name = document.getElementById('commentName').value.trim() || '匿名访客';
            const email = document.getElementById('commentEmail').value.trim();
            const content = document.getElementById('commentContent').value.trim();
            
            if (!content) {
                showToast('请输入评论内容', 'error');
                return;
            }
            
            const article = articles.find(a => a.id === currentArticleId);
            article.comments.push({
                name: isOwner ? OWNER_NAME : name,
                email,
                content,
                time: new Date().toISOString(),
                isOwner: isOwner
            });
            
            saveArticles();
            renderComments(article);
            
            // 清空表单
            if (!isOwner) {
                document.getElementById('commentName').value = '';
                document.getElementById('commentEmail').value = '';
            }
            document.getElementById('commentContent').value = '';
            
            showToast(isOwner ? '博主回复成功！' : '评论发表成功！', isOwner ? 'owner' : 'success');
        }

        // 渲染评论
        function renderComments(article) {
            const list = document.getElementById('commentsList');
            const count = document.getElementById('commentCount');
            
            count.textContent = article.comments.length;
            
            if (article.comments.length === 0) {
                list.innerHTML = '<div class="empty-comments">暂无评论，快来抢沙发吧！</div>';
                return;
            }
            
            list.innerHTML = article.comments.map(comment => `
                <div class="comment-item">
                    <div class="comment-author">
                        <div class="comment-avatar ${comment.isOwner ? 'owner' : ''}">${comment.name.charAt(0)}</div>
                        <span class="comment-name ${comment.isOwner ? 'owner' : ''}">
                            ${escapeHtml(comment.name)}
                            ${comment.isOwner ? '<span class="owner-tag">博主</span>' : ''}
                        </span>
                        <span class="comment-time">${formatDate(comment.time)}</span>
                    </div>
                    <div class="comment-content">${escapeHtml(comment.content)}</div>
                </div>
            `).join('');
        }

        // 工具函数
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
            if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
            
            return date.toLocaleDateString('zh-CN');
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const msg = document.getElementById('toastMessage');
            
            toast.className = `toast ${type}`;
            icon.textContent = type === 'owner' ? '👑' : (type === 'error' ? '❌' : '✅');
            msg.textContent = message;
            
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // 点击弹窗外部关闭
        document.getElementById('articleModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });

        // 初始化
        renderArticles();
    </script>
</body>
</html>
